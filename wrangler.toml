# Next Chair worker config — keep this file next to worker.js
name = "nextchair"
main = "worker.js"
compatibility_date = "2025-01-01"

# Bind the worker to /next-chair* on your live domain.
# Only these URLs hit this worker — everything else keeps hitting bdgwebsite.
[[routes]]
pattern = "businessdatagurus.com/next-chair*"
zone_name = "businessdatagurus.com"
